  <g fill="#4DA2FF">
    <circle cx="840" cy="74" r="5" fill-opacity="0.8"/>
    <circle cx="905" cy="118" r="4" fill-opacity="0.6"/>
    <circle cx="872" cy="216" r="5" fill-opacity="0.75"/>
    <circle cx="948" cy="246" r="4" fill-opacity="0.55"/>
    <circle cx="1102" cy="106" r="4.5" fill-opacity="0.7"/>
