    <text x="72" y="234" font-size="17" fill="#A9BFDF">Durable personal context — encrypted, anchored to Walrus Memory,</text>
    <text x="72" y="258" font-size="17" fill="#A9BFDF">and semantically recalled across every session, client, and device.</text>
    <text x="72" y="294" font-size="11.5" font-weight="600" letter-spacing="3.5" fill="#5E7BA6">SUI MAINNET &#183; WALRUS MEMORY &#183; SEAL ENCRYPTION &#183; MCP</text>
