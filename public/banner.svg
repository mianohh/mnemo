    <line x1="965" y1="150" x2="905" y2="118"/>
    <line x1="965" y1="150" x2="1010" y2="72"/>
    <line x1="965" y1="150" x2="1062" y2="150"/>
    <line x1="965" y1="150" x2="1035" y2="224"/>
    <line x1="965" y1="150" x2="872" y2="216"/>
    <line x1="840" y1="74" x2="905" y2="118"/>
    <line x1="1010" y1="72" x2="1102" y2="106"/>
    <line x1="1062" y1="150" x2="1102" y2="106"/>
    <line x1="1035" y1="224" x2="1118" y2="248"/>
    <line x1="872" y1="216" x2="948" y2="246"/>
    <line x1="948" y1="246" x2="1035" y2="224"/>
    <line x1="872" y1="216" x2="905" y2="118"/>
    <line x1="1062" y1="150" x2="1118" y2="248"/>
